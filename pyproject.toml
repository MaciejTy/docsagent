[project]
name = "docsagent"
version = "0.1.0"
description = "Question answering over markdown documentation (semantic search API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "sentence-transformers>=5.5.1",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
